<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.12)"/>
    </pattern>
    <filter id="blurBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blurPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Ambient Aurora Orbs with proper feGaussianBlur -->
  <circle cx="1020" cy="160" r="240" fill="#38bdf8" opacity="0.18" filter="url(#blurBlue)"/>
  <circle cx="180" cy="460" r="260" fill="#a855f7" opacity="0.14" filter="url(#blurPurple)"/>
  <circle cx="650" cy="550" r="180" fill="#6366f1" opacity="0.12" filter="url(#blurBlue)"/>

  <!-- Center Floating Glass Terminal Card -->
  <g transform="translate(160, 115)">
    <!-- Glass panel background -->
    <rect width="880" height="400" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Window top bar -->
    <rect width="880" height="44" rx="20" fill="rgba(0, 0, 0, 0.35)"/>
    <!-- Window controls -->
    <circle cx="28" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    <text x="440" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" text-anchor="middle">hello-world.ts</text>

    <!-- Code pill badge -->
    <g transform="translate(60, 90)">
      <rect width="126" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
      <text x="63" y="19" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">HELLO WORLD</text>
    </g>

    <!-- Main Typography -->
    <text x="60" y="195" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">Welcome to My Blog</text>
    <text x="60" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Software engineering, agentic AI frameworks &amp; developer tools.</text>

    <!-- Code snippet line -->
    <g transform="translate(60, 290)">
      <rect width="760" height="50" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <text x="24" y="32" fill="#38bdf8" font-family="monospace" font-size="15">const</text>
      <text x="75" y="32" fill="#f1f5f9" font-family="monospace" font-size="15">writer</text>
      <text x="135" y="32" fill="#94a3b8" font-family="monospace" font-size="15">=</text>
      <text x="155" y="32" fill="#c084fc" font-family="monospace" font-size="15">new</text>
      <text x="190" y="32" fill="#fcd34d" font-family="monospace" font-size="15">Developer</text>
      <text x="270" y="32" fill="#94a3b8" font-family="monospace" font-size="15">({ name:</text>
      <text x="345" y="32" fill="#34d399" font-family="monospace" font-size="15">"Michael Doyle"</text>
      <text x="490" y="32" fill="#94a3b8" font-family="monospace" font-size="15">});</text>
      <circle cx="725" cy="25" r="4" fill="#38bdf8" opacity="0.8"/>
    </g>
  </g>
</svg>
